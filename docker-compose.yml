services:
  db:
    image: postgres:16
    command: ['postgres', '-c', 'port=5000']
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ledgerflow
    ports:
      - '6000:5000'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
